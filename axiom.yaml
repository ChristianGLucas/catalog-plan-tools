name: christiangeorgelucas/catalog-plan-tools
version: 0.7.2
language: go
nodes:
    - name: SearchSteps
      input: SearchStepsInput
      output: SearchStepsResult
      required_secrets:
        - ANTHROPIC_API_KEY
    - name: AssemblePlan
      input: AssemblePlanInput
      output: PlanResult
    - name: CheckBridges
      input: CheckBridgesInput
      output: PlanResult
    - name: PlanFanOut
      input: FanOutRequest
      output: FanOutPlan
      mutation_capable: true
    - name: SearchStepAt
      input: FanOutPlan
      output: FanOutCell
      required_secrets:
        - ANTHROPIC_API_KEY
    - name: AssembleFromCells
      input: FanInInput
      output: PlanResult
