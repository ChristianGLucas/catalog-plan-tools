name: christiangeorgelucas/catalog-plan-tools
version: 0.5.0
language: go
nodes:
    - name: SearchSteps
      input: SearchStepsInput
      output: SearchStepsResult
    - name: AssemblePlan
      input: AssemblePlanInput
      output: PlanResult
    - name: CheckBridges
      input: CheckBridgesInput
      output: PlanResult
    - name: PlanFanOut
      input: FanOutRequest
      output: FanOutPlan
      mutation_capable: true
