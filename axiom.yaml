name: christiangeorgelucas/catalog-plan-tools
version: 0.6.2
language: go
nodes:
    - name: SearchSteps
      input: SearchStepsInput
      output: SearchStepsResult
    - name: AssemblePlan
      input: AssemblePlanInput
      output: PlanResult
    - name: CheckBridges
      input: CheckBridgesInput
      output: PlanResult
    - name: PlanFanOut
      input: FanOutRequest
      output: FanOutPlan
      mutation_capable: true
    - name: SearchStepAt
      input: FanOutPlan
      output: FanOutCell
    - name: AssembleFromCells
      input: FanInInput
      output: PlanResult
