// Data contracts for catalog-plan-tools: turn a decomposed task (a list of
// capability queries) into ranked, scored candidate nodes from the Axiom
// marketplace catalog, and assemble the results into a build plan with
// explicit gaps where the catalog has no match.

syntax = "proto3";

package christiangeorgelucas.catalog_plan_tools;

option go_package = ".;gen";

// The queries to search the catalog for — one query per decomposed capability
// step. Exactly one of queries / queries_json / query should be provided;
// precedence is queries > queries_json > query. queries_json exists so an
// upstream LLM's raw text can be passed without fragile flow-level parsing.
message SearchStepsInput {
  // One catalog query per step, e.g. ["validate IBAN checksum", "look up bank by IBAN"]. Highest precedence.
  repeated string queries = 1;
  // Raw JSON (or LLM text containing JSON) holding the queries. Parsed defensively: code fences are
  // stripped, and the first JSON structure found is accepted as ["q1","q2"], [{"query":...}],
  // [{"description":...}], {"steps":[...]}, or {"queries":[...]}. Used only when queries is empty.
  string queries_json = 2;
  // A single query — used only when both queries and queries_json are empty. Lets a caller run the
  // whole task description as one search (the planner flow's no-LLM fallback branch does this).
  string query = 3;
  // Max candidates returned per step. 0 means the default of 5.
  int32 limit = 4;
}

// Input for PlanFanOut: the decomposed steps to fan out over, plus the search
// knobs forwarded to the cells.
message FanOutRequest {
  // The fan-out column is NOT a caller knob: PlanFanOut locates the flow's
  // AUTHORED SearchStepAt cell by reflection and appends rows to ITS column.
  // Field 4 held the removed fanout_col knob and is never reused.
  reserved 4;
  reserved "fanout_col";

  // One catalog query per step. Highest precedence.
  repeated string queries = 1;
  // Raw JSON (or LLM text containing JSON) holding the queries — same
  // defensive parsing as SearchStepsInput.queries_json.
  string queries_json = 2;
  // A single query, used only when queries and queries_json are empty.
  string query = 3;
  // Forwarded to every cell: max runner-up candidates per step. 0 -> 5.
  int32 max_alternatives = 5;
  // Forwarded to every cell: minimum score to count the step matched. 0 -> 0.45.
  double threshold = 6;
  // Set true by a caller who KNOWS the original task text was blank — refuses
  // to fan out even when an upstream LLM invented steps for the empty task
  // (the phantom-plan defect class found live in v0 of the sync planner).
  bool task_blank = 7;
  // The upstream LLM's error field, forwarded verbatim ("" when decomposition
  // succeeded). Surfaces in FanOutPlan.error as "decompose: <detail>" when the
  // step list is unusable, so a transient LLM failure is attributed honestly.
  string llm_error = 8;
  // The original task description, echoed straight back out on FanOutPlan and
  // used by nothing here. It exists because a MUTATING run continues on a
  // forked child graph that resumes AT this node: the flow's @flow_input node
  // does not re-fire there, so a downstream consumer of the task text (the
  // skeleton renderer in CheckBridges) can only be fed from a node that runs
  // in the child. This is that carrier.
  string task = 9;
}

// Output of PlanFanOut AND the input every search cell receives — the
// AUTHORED cell over the flow's authored edge, and each appended cell over the
// mutation-added edge that replicates it. Added edges carry no adapters, so
// the whole plan is broadcast and each cell picks its own step by reading its
// canvas row via reflection. Field numbers are additive-only: a mutation-added
// edge is type-checked by message identity, and older running graphs may still
// carry a plan encoded by an earlier version of this package.
message FanOutPlan {
  // One query per decomposed step; the cell at fan-out row k searches queries[k].
  repeated string queries = 1;
  // The canvas column the search cells occupy — DISCOVERED by reflection from
  // the flow's authored cell, not chosen by the caller. 0 when this invocation
  // found no graph (direct invoke).
  int32 fanout_col = 2;
  // How many cells THIS invocation appended (0 when the plan has a single step
  // — the authored cell already fits — or when the lineage was already grown,
  // or when there was nothing to plan).
  int32 appended = 3;
  // True when this invocation emitted the mutation batch that grows the graph.
  bool mutated = 4;
  // Degradation attribution: why nothing (or less than expected) was appended.
  string error = 5;
  // Search knobs forwarded to every cell.
  int32 max_alternatives = 6;
  double threshold = 7;
  // The upstream LLM's error field, forwarded verbatim ("" when decomposition
  // succeeded). Rides the plan into every cell so the join's assemble step can
  // attribute a degraded plan honestly — the assemble node's ONLY inbound
  // edges are cell edges, so every knob it needs must travel this way.
  string llm_error = 8;
  // True when the original task text was blank. Rides the plan into every cell
  // for the same reason as llm_error. PlanFanOut itself refuses to fan out in
  // this case, so a cell only ever sees it true on a non-mutating run.
  bool task_blank = 9;
  // The original task description, echoed verbatim from the request. The
  // terminal skeleton renderer needs it, and a mutating run's forked child
  // resumes AT PlanFanOut — the flow's @flow_input node never re-fires there,
  // so an edge from this node is the only way the task text reaches a node
  // downstream of the fork. Ignored by the cells.
  string task = 10;
}

// What one fan-out cell produced: which row/step it owns and the scored
// catalog candidates for that step.
message CellResult {
  // The fan-out row this cell occupies — also the index of its step. When the
  // node runs outside a flow (direct invoke) there is no canvas position and
  // the cell defaults to row 0, noted in error.
  int32 row = 1;
  // The canvas column this cell landed in (the fan-out column; 0 outside a flow).
  int32 col = 2;
  // queries[row], the step this cell searched. "" when row was out of range.
  string query = 3;
  // True when the best candidate cleared the threshold (default 0.45).
  bool matched = 4;
  // The best candidate's score, reported even below the threshold (0 when
  // there were no candidates).
  double score = 5;
  // The search results for this step.
  StepCandidates step = 6;
  // Empty on success. "ROW_OUT_OF_RANGE: ..." when the cell's row has no step
  // (row >= number of queries); "NO_QUERY" when the plan carried no queries at
  // all; "NO_GRAPH: ..." (informational, search still runs against row 0) when
  // invoked outside a flow. Search transport failures appear on step.error.
  string error = 7;
}

// Output of SearchStepAt: one cell's contribution to the fan-in, wrapped so a
// join over the cell column collects members with a plain repeated-field pick
// (mutation-replicated member edges append their element in row order). The
// scalar fields are the broadcast knobs echoed back out of the plan: the
// assemble node's only inbound edges are cell edges, so this echo is how
// threshold / max_alternatives / llm_error / task_blank reach it. The compose
// plan takes them as SINGULAR picks off the AUTHORED cell edge, which
// mutation does not replicate — so the authored cell's echo is the one that
// lands, and every cell echoes the same broadcast values anyway.
message FanOutCell {
  // Always exactly one element: this cell's result.
  repeated CellResult items = 1;
  // Minimum score to count a step matched, echoed from the plan (0 = default).
  double threshold = 2;
  // Max runner-up refs per step, echoed from the plan (0 = default).
  int32 max_alternatives = 3;
  // The upstream LLM's error, echoed from the plan ("" when decomposition
  // succeeded).
  string llm_error = 4;
  // Whether the original task text was blank, echoed from the plan.
  bool task_blank = 5;
}

// Input for AssembleFromCells: what the authored join collects from the fan-out
// column. cells grows to one element per cell as the join collects every member
// edge; the scalars come from the authored cell's edge (singular picks).
message FanInInput {
  // One entry per fan-out cell, in join-collection order. AssembleFromCells
  // sorts by row before assembling, so arrival order never matters.
  repeated CellResult cells = 1;
  // The upstream LLM's error field, forwarded verbatim ("" when decomposition
  // succeeded). Surfaces in PlanResult.error as "decompose: <detail>".
  string llm_error = 2;
  // Minimum candidate score to count a step as matched. 0 means the default of 0.45.
  double threshold = 3;
  // Max runner-up node refs per step in alternatives. 0 means the default of 3.
  int32 max_alternatives = 4;
  // Set true by a caller who KNOWS the original task text was blank — forces
  // the "none"/NO_INPUT verdict even when cell results are present, for the
  // same phantom-plan reason as AssemblePlanInput.task_blank.
  bool task_blank = 5;
}

// One candidate node from the catalog, with a locally computed relevance score.
message Candidate {
  // The node's name, e.g. "ValidateIban".
  string node = 1;
  // The fully qualified package, e.g. "christiangeorgelucas/iban-tools".
  string package = 2;
  // The package version this node was found at.
  string version = 3;
  // The node's published description (may be empty if the package author omitted one).
  string description = 4;
  // Locally computed relevance in [0,1]: the weighted fraction of the query's informative words
  // (stopwords dropped, node names split on case) found in this candidate's name + package +
  // description. Domain-specific words ("iban", "xml", "checksum") carry full weight; generic
  // capability verbs and data-shape words ("parse", "validate", "details", "document", "schema")
  // carry a reduced weight, and a candidate that matches NONE of the query's domain-specific
  // words has its score halved — so generic-word overlap alone cannot clear the 0.45 match
  // threshold for any realistic query. A domain word the candidate mentions only inside an
  // unrelated hyphenated compound (e.g. "qr" appearing solely in "QR-IBAN" for a QR-code query)
  // counts as generic, not as a domain match. This is a lexical measure computed by this node, NOT a
  // platform ranking signal — the platform's search API returns no thresholdable score today.
  // 1.0 still means every informative query word matched.
  double score = 5;
}

// The candidates found for one step's query.
message StepCandidates {
  // The query this step searched for, echoed verbatim.
  string query = 1;
  // Ranked candidates, best first, capped at the requested limit. Empty means the catalog returned
  // nothing for the query or any of its relaxed keyword variants — a genuine "no match" signal.
  repeated Candidate candidates = 2;
  // True when the full-phrase search returned nothing and these candidates came from relaxed
  // per-keyword searches instead — treat them with more skepticism than a phrase hit.
  bool relaxed = 3;
  // Non-empty when the search API could not be reached for this query (transport/HTTP failure).
  // An unreachable search is NOT a "no match": candidates is empty but nothing was actually ruled out.
  string error = 4;
}

// Per-step search results, in input order.
message SearchStepsResult {
  // One entry per input query, in the same order as the input.
  repeated StepCandidates steps = 1;
  // Number of entries in steps. Present even when zero-valued fields are omitted from JSON.
  int32 step_count = 2;
  // Which input field drove the search: "queries", "queries_json", or "query". Empty on input error.
  string source = 3;
  // Empty on success. "NO_QUERY" when no usable query was provided (including unparseable
  // queries_json — the parse detail follows after a colon). "ALL_QUERIES_FAILED" when every
  // per-step search hit a transport error (see each step's error field for detail).
  string error = 4;
}

// Everything AssemblePlan needs: the primary (LLM-decomposed) search results, the fallback
// (whole-description) results, and the upstream LLM's error state for honest attribution.
message AssemblePlanInput {
  // Search results for the LLM-decomposed steps. May be empty when decomposition failed.
  repeated StepCandidates primary = 1;
  // Search results for the whole task description as a single query — the degraded plan used
  // when primary is empty.
  repeated StepCandidates fallback = 2;
  // The upstream LLM's error field, forwarded verbatim ("" when the LLM branch succeeded).
  // Surfaces in PlanResult.error as "decompose: <detail>" when the plan fell back.
  string llm_error = 3;
  // Minimum candidate score to count a step as matched. 0 means the default of 0.45.
  double threshold = 4;
  // Max runner-up node refs per step in alternatives. 0 means the default of 3.
  int32 max_alternatives = 5;
  // Set true by a caller who KNOWS the original task text was blank — forces the
  // "none"/NO_INPUT verdict even when search results are present. Exists because an
  // LLM decomposer, handed an empty task, cheerfully invents generic steps that then
  // match real nodes — producing a confident plan for no task at all (observed live).
  // Omitted/false leaves behavior unchanged.
  bool task_blank = 6;
}

// One step of the assembled plan: the capability, whether the catalog covers it, and with what.
message PlanStep {
  // The step's capability query, echoed from the search results.
  string description = 1;
  // True when the best candidate's score cleared the threshold. False for both "no candidates at
  // all" and "candidates all below threshold" — score and node distinguish those.
  bool matched = 2;
  // Best-pick node name ("" when unmatched).
  string node = 3;
  // Best-pick fully qualified package ("" when unmatched).
  string package = 4;
  // Best-pick package version ("" when unmatched).
  string version = 5;
  // The best candidate's score, reported even when it fell below the threshold (0 when the step
  // had no candidates at all).
  double score = 6;
  // The best-pick node's published description ("" when unmatched).
  string node_description = 7;
  // Runner-up refs as "package/Node@version", best first, for callers that prefer a different pick.
  repeated string alternatives = 8;
  // Non-empty when this step's catalog search transport-failed (copied from the search result).
  // Such a step is unmatched but NOT a gap — nothing was ruled out. Empty otherwise.
  string error = 9;
}

// A step the catalog cannot cover — the "what to build" output.
message Gap {
  // The uncovered capability, echoed from the step's query.
  string description = 1;
  // A deterministic suggestion for closing the gap (a candidate package shape to propose).
  string proposal_hint = 2;
}

// One type-bridge verdict between the picks of two adjacent matched plan steps, computed from the
// nodes' published proto schemas (fetched from the public registry at check time). The check is
// deliberately asymmetric in confidence: a "bridged" verdict is strong positive evidence (a shared
// typed carrier like a URL, IBAN, or timestamp connects an output leaf to a top-level input), but
// the carrier taxonomy ignores freeform strings on purpose, so the ABSENCE of a carrier match is
// weak evidence — many legitimate flows bridge via plain string fields. "blocked" is therefore
// reserved for structural impossibility, not mere lack of carrier evidence.
message BridgeCheck {
  // The producing step's pick as "package/Node@version".
  string from_node = 1;
  // The consuming step's pick as "package/Node@version".
  string to_node = 2;
  // Never empty. "bridged": a shared typed carrier connects an output leaf of from_node to a
  // top-level scalar input of to_node (see via). "plausible": no shared carrier, but the producer
  // emits at least one scalar leaf of a type the consumer accepts on a top-level field — nothing
  // rules the edge out, verify the field pairing manually. "blocked": structurally impossible for
  // an edge adapter — the consumer exposes no top-level scalar (or repeated-scalar) input a foreign
  // producer can feed, or the producer's output leaf types and the consumer's accepted types are
  // disjoint (see detail). "unknown": the schemas could not be fetched or parsed (see detail) —
  // nothing was verified either way.
  string verdict = 3;
  // True only for verdict "bridged" — carrier-evidenced compatibility. A "plausible" pair is
  // deliberately false here so callers gating on compatible get only the strong claims.
  bool compatible = 4;
  // For "bridged": the strongest carrier pairing as "<carrier>: <output path> -> <input field>",
  // e.g. "url: release.download_url -> target_url". Empty otherwise.
  string via = 5;
  // Human-readable explanation of the verdict (why blocked, what failed for unknown, what type
  // overlap exists for plausible). Empty only when via says it all.
  string detail = 6;
}

// Everything CheckBridges needs: the assembled plan, passed field-for-field from AssemblePlan's
// PlanResult (the flow edge maps each field 1:1). CheckBridges re-emits the same plan with
// bridges populated, bridge_status set, and feasible re-derived as matched-AND-not-blocked.
message CheckBridgesInput {
  // PlanResult.feasible from the assemble step.
  bool feasible = 1;
  // PlanResult.plan_basis from the assemble step ("decomposed" / "fallback" / "none").
  string plan_basis = 2;
  // PlanResult.matched_count from the assemble step.
  int32 matched_count = 3;
  // PlanResult.step_count from the assemble step.
  int32 step_count = 4;
  // PlanResult.coverage from the assemble step.
  double coverage = 5;
  // PlanResult.steps from the assemble step.
  repeated PlanStep steps = 6;
  // PlanResult.gaps from the assemble step.
  repeated Gap gaps = 7;
  // PlanResult.error from the assemble step, carried through verbatim (bridge-stage errors are
  // appended after it).
  string error = 8;
  // The original task description, forwarded from the flow input ("" when the caller has none).
  // Used only to name and document the emitted skeleton_yaml — it never affects any verdict.
  string task = 9;
}

// The assembled build plan.
message PlanResult {
  // True only when a plan basis exists AND every step in it matched AND (once CheckBridges has
  // run — see bridge_status) no adjacent pair of picks is structurally blocked. A "plausible" or
  // "unknown" bridge verdict does NOT clear feasible to false: the carrier taxonomy's silence is
  // weak evidence, and an unreachable registry proves nothing. Always read plan_basis alongside
  // this: false with basis "none" means "nothing to plan from", not "steps unmatched".
  bool feasible = 1;
  // Explicit sentinel for which inputs produced the plan: "decomposed" (primary results),
  // "fallback" (whole-description results, because primary was empty), or "none" (both empty).
  // Never empty — this field is set on every path so an absent feasible=false is never ambiguous.
  string plan_basis = 2;
  // Steps whose best candidate cleared the threshold.
  int32 matched_count = 3;
  // Total steps in the plan basis.
  int32 step_count = 4;
  // matched_count / step_count in [0,1] (0 when step_count is 0). Callers wanting looser
  // feasibility than all-steps-matched (e.g. >= 0.6 coverage) read this.
  double coverage = 5;
  // The per-step picks, in step order.
  repeated PlanStep steps = 6;
  // One entry per unmatched step: what the catalog is missing.
  repeated Gap gaps = 7;
  // Empty on a fully clean call. "decompose: <detail>" when the LLM branch failed and the plan
  // fell back (the plan itself is still valid, just single-step); "search: <detail>" when a
  // step's search transport-failed (that step is NOT counted as a gap — nothing was ruled out);
  // "NO_INPUT" when there was nothing to assemble from. CheckBridges appends "bridge: <detail>"
  // entries for pairs it could not verify (verdict "unknown") or found blocked.
  string error = 8;
  // One verdict per adjacent pair of MATCHED steps, in step order (a pair separated by an
  // unmatched step is not checked — the missing node's types are unknown). Empty from
  // AssemblePlan (bridge_status "unchecked"), and empty from CheckBridges when the plan has
  // fewer than two adjacent matched steps (bridge_status "no_pairs").
  repeated BridgeCheck bridges = 9;
  // Never empty once set by this package's nodes. "unchecked": AssemblePlan output — no bridge
  // analysis ran (v0-compatible). From CheckBridges: "no_pairs" (fewer than two adjacent matched
  // steps — nothing to check), "bridged" (every checked pair carrier-bridged), "plausible" (no
  // pair blocked, at least one only type-plausible), "blocked" (at least one pair structurally
  // blocked — feasible is forced false), "unknown" (at least one pair unverifiable and none
  // blocked). Older v0 PlanResults predate this field and omit it entirely.
  string bridge_status = 10;
  // A draft flow.yaml STARTING POINT rendered from the matched picks and bridge verdicts: one node
  // per matched step, an input_facade stub mirroring the first pick's published input fields
  // (names, types, descriptions), a proposed edge per adjacent matched pair — a "bridged" pair's
  // adapter maps the carrier pairing named in via; a "plausible" pair's adapter proposes the
  // closest type-compatible pairing under a "TODO(planner)" marker — and comments marking gaps and
  // blocked/unverifiable edges. Emitted by CheckBridges whenever the plan has at least one matched
  // step; "" from AssemblePlan and "" when nothing matched. The caller owns verifying every
  // adapter (especially TODO(planner) markers), adding @flow_input edges for interior-node fields,
  // and any output_facade — as emitted, the response contract is the terminal node's own output
  // message. Feed it to `axiom flow validate` and refine from there.
  string skeleton_yaml = 11;
}
